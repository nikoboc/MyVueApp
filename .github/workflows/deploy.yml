name: Deploy to GitHub Pages

# main への push で自動的にビルドし、GitHub Pages へ公開する。
# 手動実行もできるようにしておく（workflow_dispatch）。
on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages への公開に必要な権限のみを与える。
permissions:
  contents: read
  pages: write
  id-token: write

# 公開は 1 度に 1 つだけ実行する。連続で push したときに、古いビルドが後から
# 上書きしてしまうのを防ぐ。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package-lock.json のとおりに入れる。npm install と違い、内容を書き換えない。
      - run: npm ci

      # 型チェックも実行される（package.json の build を参照）。型エラーがあれば
      # ここで失敗し、壊れた状態が公開されることはない。
      # base パスは GITHUB_REPOSITORY から vite.config.ts が導出する。
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
